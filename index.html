  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: d(P.s), iterations: P.n, hash: "SHA-256" }, base, 256));
}
const saved = store.get();
if (saved) decrypt(d(saved)).then(show).catch(() => store.clear());
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Unlocking…"; err.hidden = true;
  try {
    const raw = await derive(document.getElementById("pw").value);
    const html = await decrypt(raw);
    store.set(btoa(String.fromCharCode(...raw)), document.getElementById("rem").checked);
    show(html);
  } catch (x) {
    err.hidden = false; btn.disabled = false; btn.textContent = "Continue";
    document.getElementById("pw").select();
  }
});
